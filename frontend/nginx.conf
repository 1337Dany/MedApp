server {
    listen 80;
    server_name localhost;

    # Text responses (the bundle, API JSON) travel compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    root /usr/share/nginx/html;

    # Vite puts a content hash into these file names, so a browser may keep them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current bundle: always revalidated, so a deploy shows up on the next load.
    location / {
        index index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxying packets to backend
    location /api/ {
        proxy_pass http://api:5000;
        
        # Default parameters to implement .Net
        proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
    }
}