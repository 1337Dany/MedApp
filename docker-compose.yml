services:
  api:
    build: ./backend
    container_name: medapp_backend
    restart: unless-stopped
    ports:
      - ${API_HTTP_PORT}:8080
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Postgres: Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DATABASE};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

  frontend:
    build: ./frontend
    container_name: medapp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
