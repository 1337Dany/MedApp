services:
  postgresql:
    image: postgres
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql
  
  api:
    build: ./backend
    container_name: medapp_backend
    restart: unless-stopped
    environment:
      API_HTTP_PORT: ${API_HTTP_PORT}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Postgres: Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - ${API_HTTP_PORT}:8080
    depends_on:
      - postgresql

  frontend:
    build: ./frontend
    container_name: medapp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api