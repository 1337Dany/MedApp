services:
  postgresql:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  api:
    build: ./backend
    container_name: medapp_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT= Development
      - ConnectionStrings__Postgres:Host=localhost;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

  frontend:
    build: ./frontend
    container_name: medapp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
